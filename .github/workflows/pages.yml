name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Preparar arquivos do site
        run: |
          mkdir -p _site
          cp -R index.html projetos.html assets _site/

      - name: Empacotar artefato
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v5
